[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-recovery"
version = "0.1.0"
description = "Bounded mandate step-up recovery agent buildathon prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
