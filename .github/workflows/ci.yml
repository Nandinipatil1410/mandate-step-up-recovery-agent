name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce judged evidence
        run: |
          python scripts/generate_dataset.py --seed 42 --count 200
          python scripts/compare_flows.py --run-id ci-comparison --seed 42 --provider scripted
          python scripts/run_recovery.py --run-id ci-lifecycle --seed 42 --decision-provider scripted --notification-provider template
          python scripts/verify_audit.py data/runs/ci-lifecycle/audit_events.jsonl
